name: E2E CI

# End-to-end tests drive the real web app against the real API, so this workflow
# stands up both: a seeded Laravel backend (php artisan serve) and a built
# Next.js frontend (next start), then runs Playwright against them. It spans both
# apps, so it triggers on changes to either (or to the workflow itself).
on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e-ci.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leanbox_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend DB (php artisan serve + the E2E artisan bridge read backend/.env,
      # but these process-env values win over the .env file).
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: leanbox_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # ---- Backend: install, seed, serve -----------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare backend environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate + seed the demo dataset
        working-directory: backend
        run: php artisan migrate:fresh --seed --force

      - name: Serve the API (background)
        working-directory: backend
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          # Wait until the API answers before continuing.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/products >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not start in time" >&2; exit 1

      # ---- Frontend: install, build, run Playwright ------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # `npm install` (not `npm ci`) — see frontend-ci.yml for the Tailwind v4 /
        # lightningcss per-platform optional-deps rationale.
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the web app
        working-directory: frontend
        # NEXT_PUBLIC_API_URL defaults to http://localhost:8000/api/v1 (the served
        # API above), so no build-time override is needed.
        run: npm run build

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
